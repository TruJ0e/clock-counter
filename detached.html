<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'self' data:; object-src 'none'; base-uri 'none'">
  <meta name="theme-color" content="#050505">
  <title>CLOCK COUNTER — Floating Clock</title>
  <link rel="stylesheet" href="./src/styles.css">
  <style>
    body{overflow:hidden;background:#050505}
    .floating-app{width:100%;height:100dvh;display:flex;flex-direction:column;border:2px solid #f7f7f4}
    .floating-heading{display:flex;align-items:center;gap:8px;flex:0 0 38px;padding:5px 8px;border-bottom:2px solid #f7f7f4;font-size:15px}
    .floating-heading span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;flex:1}
    .floating-heading button{border:1px solid #f7f7f4;padding:3px 8px}
    .floating-stage{flex:1;min-height:0;min-width:0;display:grid;place-items:center;padding:10px;container-type:size}
    .floating-dial{position:relative;aspect-ratio:1;width:min(96cqw,96cqh);max-width:100%;border:4px solid #f7f7f4;border-radius:50%;background:#f20b14;display:grid;place-items:center}
    .floating-readout{font-size:clamp(20px,11cqw,54px);border:3px solid #f7f7f4;background:#050505;color:#f7f7f4;padding:4px 10px;white-space:nowrap;font-variant-numeric:tabular-nums}
    .floating-readout.long{font-size:clamp(17px,8cqw,38px)}
    .floating-footer{display:flex;gap:7px;padding:6px;border-top:2px solid #f7f7f4;flex:0 0 46px}
    .floating-footer button{flex:1;border:1px solid #f7f7f4;padding:4px;font-size:13px}
    .floating-footer button:first-child{border-color:#16e600}
    .floating-status{font-size:10px;text-align:center;color:#c8c8c8;min-height:13px}
  </style>
</head>
<body>
  <div class="floating-app">
    <div class="floating-heading"><span id="float-name">FLOATING CLOCK</span><button id="float-close" aria-label="Close floating clock">×</button></div>
    <div class="floating-stage">
      <div id="float-dial" class="floating-dial" role="img" aria-label="Floating countdown">
        <output id="float-readout" class="floating-readout">--:--</output>
      </div>
    </div>
    <div class="floating-status" id="float-status">CONNECTED TO MAIN TIMER</div>
    <div class="floating-footer">
      <button id="float-play" aria-label="Start or pause floating clock">Play</button>
      <button id="float-reset" aria-label="Reset floating clock">Reset</button>
      <button id="float-ack" aria-label="Acknowledge alarm" hidden>Acknowledge</button>
    </div>
  </div>
  <script type="module" src="./src/detached.js"></script>
</body>
</html>
